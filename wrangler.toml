name = "besh"
main = "apps/worker/src/index.ts"

# Secrets (set with `wrangler secret put`, or .dev.vars locally):
#   CREDENTIAL_KEY, TICKET_SECRET
#   Optional: TURNSTILE_SITE_KEY + TURNSTILE_SECRET enable deployment-managed human verification.
#   CREDENTIAL_KEY is the base64 of a 32-byte AES-256 key; generate it once
#   and never rotate it without re-sealing, or stored credentials become unreadable.
compatibility_date = "2026-10-01"

workers_dev = false
routes = [{ pattern = "ssh.sadd.ing", custom_domain = true }]

# Every version would otherwise get its own public hostname; the app has one
# origin by design, and an extra hostname is one more place to leave unclaimed.
preview_urls = false

# Created with `wrangler d1 create besh`; the id belongs to this project.
# A fork must replace it with the id its own `wrangler d1 create` returns.
# Local runs (`--local`) still use their own SQLite file under .wrangler/state.
[[d1_databases]]
binding = "DB"
database_name = "besh"
database_id = "220dc762-004c-4638-be00-58825a0a1bca"
migrations_dir = "db/migrations"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionOwner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionOwner"]

# AI attachments: the bytes live here, D1 keeps only the id, name and MIME type.
# Created with `wrangler r2 bucket create besh`.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "besh"

# The worker serves the built SPA itself, so development and production share one
# origin. A dev proxy would test a topology that never ships.
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Attachments that no stored turn points at are swept once a day. The sweep only
# touches objects older than a day, so an upload in flight is never a candidate.
[triggers]
crons = ["17 4 * * *"]

[ai]
binding = "AI"

# Machine MCP access is independent of human login. Set false for immediate rollback.
[vars]
MCP_ENABLED = "true"
MCP_ACCESS_ISSUER = "https://neold.cloudflareaccess.com"
MCP_ACCESS_AUD = "f33786b3ff0752499672902c02297299e17978e4d57c2ab432ec9b8c316fc4f2"

[[durable_objects.bindings]]
name = "COMMAND_JOBS"
class_name = "CommandJob"

[[migrations]]
tag = "v2-command-jobs"
new_sqlite_classes = ["CommandJob"]
